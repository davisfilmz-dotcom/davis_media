<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Simple Editor | Davis Media</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<header class="nav-wrap"><nav class="nav container"><a class="brand" href="index.html"><span>Davis</span> Media</a><button class="menu-btn" aria-label="Toggle menu" aria-expanded="false">☰</button><div class="nav-links"><a href="index.html">Home</a><a href="services.html">Services</a><a href="gallery.html">Gallery</a><a class="active" href="editor.html">Simple Editor</a><a href="about.html">About</a></div></nav></header>
<main><section class="page-hero compact"><div class="container reveal"><p class="eyebrow">Browser tool</p><h1>Simple photo editor.</h1></div></section>
<section class="section"><div class="container editor-layout"><div class="editor-stage reveal"><canvas id="editor-canvas" width="900" height="600"></canvas><label class="upload-btn" for="editor-file">Choose image</label><input id="editor-file" type="file" accept="image/*" hidden></div><aside class="editor-controls reveal"><label>Brightness <input id="brightness" type="range" min="50" max="150" value="100"></label><label>Contrast <input id="contrast" type="range" min="50" max="150" value="100"></label><label>Saturation <input id="saturation" type="range" min="0" max="200" value="100"></label><label>Rotate <input id="rotation" type="range" min="0" max="270" step="90" value="0"></label><button id="reset-editor" class="btn glass" type="button">Reset</button><button id="download-editor" class="btn primary" type="button">Download</button></aside></div></section></main>
<footer><div class="container footer-inner"><a class="brand" href="index.html"><span>Davis</span> Media</a><p>© <span data-year></span> Davis Media</p></div></footer><script src="assets/js/main.js"></script><script src="assets/js/editor.js"></script></body></html>
